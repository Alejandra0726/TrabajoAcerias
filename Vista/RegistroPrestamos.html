<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/CSS/Registro.css">
    <title>CLUB ACERIAS - Registro de Préstamos</title>
</head>

<body class="fondo">
    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3>Registro de Préstamos</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm"><i class="bi bi-arrow-left"></i> Volver al panel</a>
    </div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card form-card shadow-sm p-4">
                    <form id="FormPrestamo" action="" method="POST">
                        <h6 class="seccion">Asociado</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="documento">Documento del asociado</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="documento" required placeholder="Ej: 1053638452">
                                    <button class="btn btn-outline-club" type="button"><i class="bi bi-search"></i> Buscar</button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="nombreAsociado">Nombre del asociado</label>
                                <input type="text" class="form-control" id="nombreAsociado" readonly placeholder="Se completa al buscar">
                            </div>
                            <div class="col-12">
                                <div class="alert alert-light border mb-0 py-2">
                                    <i class="bi bi-info-circle"></i> Préstamos activos: <strong id="prestamosActivos">0</strong> de 3
                                </div>
                            </div>
                        </div>

                        <h6 class="seccion mt-4">Condiciones del préstamo</h6>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label" for="codigoPrestamo">Código</label>
                                <input type="text" class="form-control" id="codigoPrestamo" readonly placeholder="Automático">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label" for="fechaPrestamo">Fecha del préstamo</label>
                                <input type="date" class="form-control" id="fechaPrestamo" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="valorPrestamo">Valor del préstamo</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="valorPrestamo" required min="1" max="80000000" placeholder="Máx. 80.000.000">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="tasaInteres">Tasa de interés mensual</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="tasaInteres" required min="0" step="0.01" placeholder="1.5">
                                    <span class="input-group-text">%</span>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="numeroCuotas">Número de cuotas</label>
                                <input type="number" class="form-control" id="numeroCuotas" required min="1" placeholder="12">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="valorCuota">Valor de la cuota</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="text" class="form-control" id="valorCuota" readonly placeholder="Calculado">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="totalPagar">Total a pagar</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="text" class="form-control" id="totalPagar" readonly placeholder="Calculado">
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="observaciones">Observaciones</label>
                                <textarea class="form-control" id="observaciones" rows="2" placeholder="Opcional"></textarea>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-club flex-fill"><i class="bi bi-save"></i> Registrar préstamo</button>
                            <button type="reset" class="btn btn-outline-club flex-fill">Limpiar formulario</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
