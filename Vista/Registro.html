<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/CSS/Registro.css">
    <title>CLUB ACERIAS - Registro de Asociados</title>
</head>

<body class="fondo">
    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3>Registro de Asociados</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm"><i class="bi bi-arrow-left"></i> Volver al panel</a>
    </div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card form-card shadow-sm p-4">
                    <form id="FormRegistro" action="../Modelo/guardarAsociado.php" method="POST">
                        <h6 class="seccion">Datos personales</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="documento">Documento</label>
                                <input type="number" class="form-control" id="documento" name="documento" required
                                    placeholder="Ej: 1053638452">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="fechaNacimiento">Fecha de nacimiento</label>
                                <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento"
                                    required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="nombre">Nombres</label>
                                <input type="text" class="form-control" id="nombre" name="nombres" required
                                    placeholder="Nombres completos">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="apellido">Apellidos</label>
                                <input type="text" class="form-control" id="apellido" name="apellidos" required
                                    placeholder="Apellidos completos">
                            </div>
                            <div class="col-12">
                                <label class="form-label d-block">Género</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" id="femenino"
                                        value="femenino" required>
                                    <label class="form-check-label" for="femenino">Femenino</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" id="masculino"
                                        value="masculino">
                                    <label class="form-check-label" for="masculino">Masculino</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" id="otro" value="otro">
                                    <label class="form-check-label" for="otro">Otro</label>
                                </div>
                            </div>
                        </div>

                        <h6 class="seccion mt-4">Contacto</h6>
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label" for="direccionResidencia">Dirección de residencia</label>
                                <input type="text" class="form-control" id="direccionResidencia"
                                    name="direccionResidencia" required placeholder="Cr 5 # 15b-89">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="ciudad">Ciudad</label>
                                <select class="form-select" id="ciudad" name="ciudad" required>
                                    <option value="" selected disabled>Seleccione</option>
                                    <option value="duitama">Duitama</option>
                                    <option value="sogamoso">Sogamoso</option>
                                    <option value="paipa">Paipa</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="telefono">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono" required
                                    placeholder="3113224567">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="email">Correo electrónico</label>
                                <input type="email" class="form-control" id="email" name="email" required
                                    placeholder="correo@ejemplo.com">
                            </div>
                            <div class="col-md-6 ">
                                <label class="form-label" for="password">Contraseña:</label>
                                <input type="password" class="form-control" id="password" name="password" minlength="8"
                                    autocomplete="new-password" required placeholder="Mínimo 8 caracteres" />
                                <!-- minlength minimo 8 caracteres-->
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="confirmarPassword">Confirmar Contraseña:</label>
                                <input type="password" class="form-control" id="confirmarPassword"
                                    name="confirmarPassword" minlength="8" autocomplete="new-password" required
                                    placeholder="Escribe de nuevo la contraseña" />

                            </div>
                        </div>


                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-club flex-fill"><i class="bi bi-save"></i> Guardar
                                asociado</button>
                            <button type="reset" class="btn btn-outline-club flex-fill">Limpiar formulario</button>
                        </div>
                    </form>
                    <p id="mensajeRegistro" role="status" aria-live="polite"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT: envía el formulario como JSON con fetch -->
    <script>
        document.getElementById("FormRegistro").addEventListener("submit", async function (e) {
            e.preventDefault(); // evita que el navegador salte al PHP

            const mensaje = document.getElementById("mensajeRegistro");
            const datos = Object.fromEntries(new FormData(this).entries());

            try {
                const respuesta = await fetch("../Modelo/guardarAsociado.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();

                mensaje.textContent = resultado.mensaje;
                mensaje.className = resultado.success ? "text-success mt-3" : "text-danger mt-3";

                if (resultado.success) this.reset();
            } catch (error) {
                mensaje.textContent = "Error de conexión con el servidor";
                mensaje.className = "text-danger mt-3";
            }
        });
    </script>
</body>

</html>
