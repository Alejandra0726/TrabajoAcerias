<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/CSS/Registro.css">
    <title>CLUB ACERIAS - Registro de Asociados</title>
</head>

<body class="fondo">
    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3>Registro de Asociados</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm"><i class="bi bi-arrow-left"></i> Volver al panel</a>
    </div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card form-card shadow-sm p-4">
                    <form id="FormRegistro" action="" method="POST">
                        <h6 class="seccion">Datos personales</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="documento">Documento</label>
                                <input type="number" class="form-control" id="documento" required placeholder="Ej: 1053638452">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="fechaNacimiento">Fecha de nacimiento</label>
                                <input type="date" class="form-control" id="fechaNacimiento" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="nombre">Nombres</label>
                                <input type="text" class="form-control" id="nombre" required placeholder="Nombres completos">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="apellido">Apellidos</label>
                                <input type="text" class="form-control" id="apellido" required placeholder="Apellidos completos">
                            </div>
                            <div class="col-12">
                                <label class="form-label d-block">Género</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" id="femenino" value="femenino" required>
                                    <label class="form-check-label" for="femenino">Femenino</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" id="masculino" value="masculino">
                                    <label class="form-check-label" for="masculino">Masculino</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" id="otro" value="otro">
                                    <label class="form-check-label" for="otro">Otro</label>
                                </div>
                            </div>
                        </div>

                        <h6 class="seccion mt-4">Contacto</h6>
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label" for="direccionResidencia">Dirección de residencia</label>
                                <input type="text" class="form-control" id="direccionResidencia" required placeholder="Cr 5 # 15b-89">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="ciudad">Ciudad</label>
                                <select class="form-select" id="ciudad" required>
                                    <option value="" selected disabled>Seleccione</option>
                                    <option value="duitama">Duitama</option>
                                    <option value="sogamoso">Sogamoso</option>
                                    <option value="paipa">Paipa</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="telefono">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" required placeholder="3113224567">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="email">Correo electrónico</label>
                                <input type="email" class="form-control" id="email" required placeholder="correo@ejemplo.com">
                            </div>
                        </div>

                        <h6 class="seccion mt-4">Datos del club</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="fechaIngreso">Fecha de ingreso al club</label>
                                <input type="date" class="form-control" id="fechaIngreso">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="estado">Estado</label>
                                <select class="form-select" id="estado">
                                    <option value="activo" selected>Activo</option>
                                    <option value="inactivo">Inactivo</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-club flex-fill"><i class="bi bi-save"></i> Guardar asociado</button>
                            <button type="reset" class="btn btn-outline-club flex-fill">Limpiar formulario</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
