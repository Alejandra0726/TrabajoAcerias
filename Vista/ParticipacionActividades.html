<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/CSS/Registro.css">
    <title>CLUB ACERIAS - Participación en Actividades</title>
</head>

<body class="fondo">
    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3>Participación en Actividades</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm"><i class="bi bi-arrow-left"></i> Volver al panel</a>
    </div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card form-card shadow-sm p-4">
                    <form id="FormParticipacion" action="" method="POST">
                        <h6 class="seccion">Actividad</h6>
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label" for="actividad">Actividad</label>
                                <select class="form-select" id="actividad" required>
                                    <option value="" selected disabled>Seleccione una actividad</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="fechaInscripcion">Fecha de inscripción</label>
                                <input type="date" class="form-control" id="fechaInscripcion" required>
                            </div>
                        </div>

                        <h6 class="seccion mt-4">Agregar asociado</h6>
                        <div class="row g-3">
                            <div class="col-md-5">
                                <label class="form-label" for="documento">Documento</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="documento" placeholder="Ej: 1053638452">
                                    <button class="btn btn-outline-club" type="button"><i class="bi bi-search"></i></button>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label" for="nombreAsociado">Nombre</label>
                                <input type="text" class="form-control" id="nombreAsociado" readonly placeholder="Se completa al buscar">
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="button" class="btn btn-club w-100"><i class="bi bi-plus-lg"></i> Añadir</button>
                            </div>
                        </div>

                        <h6 class="seccion mt-4">Participantes inscritos</h6>
                        <div class="table-responsive">
                            <table class="table table-sm table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Documento</th>
                                        <th>Nombre</th>
                                        <th class="text-end">Quitar</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaParticipantes">
                                    <tr>
                                        <td colspan="3" class="text-center text-muted">Aún no hay participantes. Busque un asociado y pulse Añadir.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-club flex-fill"><i class="bi bi-save"></i> Guardar participación</button>
                            <button type="reset" class="btn btn-outline-club flex-fill">Limpiar formulario</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
