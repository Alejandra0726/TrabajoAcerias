<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Actividades</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Iconos Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Archivo CSS personalizado -->
    <link rel="stylesheet" href="../Assets/CSS/Registro.css">

</head>

<body class="fondo">

    <div class="header-mr d-flex justify-content-between align-items-center">

        <h3 class="mb-0">Actividades del club</h3>

        <a href="dashboard.html" class="btn btn-outline-light">
            <i class="bi bi-arrow-left"></i>
            Volver al panel
        </a>

    </div>

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="h4 mb-0 seccion">
                Listado de actividades
            </h2>

            <a href="RegistroActividades.html" class="btn btn-club d-none" id="btnNuevaActividad">

                <i class="bi bi-plus-lg"></i>
                Nueva Actividad

            </a>
            <a href="Participaciones.html" class="btn btn-club">

                <i class="bi bi-people-fill"></i>
                Participaciones

            </a>


        </div>

        <!-- Formulario de filtros -->

        <div class="card shadow-sm form-card p-3 mb-4">

            <form id="FormFiltro">

                <div class="row g-3 align-items-end">

                    <div class="col-md-4">

                        <label class="form-label">Filtrar por</label>

                        <select id="filtro" class="form-select">

                            <option value="todos">
                                Todas las actividades
                            </option>

                            <option value="cantidad">
                                Cantidad de actividades por año
                            </option>

                            <option value="municipio">
                                Municipio
                            </option>

                        </select>

                    </div>

                    <div class="col-md-4 d-none" id="grupoAnio">

                        <label class="form-label">Año</label>

                        <input type="number" id="anio" class="form-control" value="2018">

                    </div>

                    <div class="col-md-4 d-none" id="grupoMunicipio">

                        <label class="form-label">Municipio</label>

                        <select id="filtroMunicipio" class="form-select">

                            <option value="duitama">Duitama</option>
                            <option value="sogamoso">Sogamoso</option>
                            <option value="paipa">Paipa</option>

                        </select>

                    </div>

                    <div class="col-md-auto">

                        <button type="submit" class="btn btn-club">
                            <i class="bi bi-search"></i>
                            Consultar
                        </button>

                        <button type="button" id="btnLimpiar" class="btn btn-outline-club">
                            Limpiar
                        </button>

                    </div>

                </div>

            </form>

        </div>

        <!-- Cantidad de actividades -->

        <div class="card shadow-sm form-card p-3 mb-4 d-none" id="contenedorCantidad">

            <h6 class="seccion">Cantidad de actividades realizadas</h6>

            <h3 id="cantidadActividades">0</h3>

        </div>

        <!-- Tabla de actividades -->
        <div class="card shadow-sm form-card" id="contenedorTabla">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle mb-0">

                    <thead class="table">


                        <tr class="encabezado">
                            <th scope="col">Actividad</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Municipio</th>
                            <th scope="col">Total recaudado</th>

                            <th id="encabezadoAcciones" class="d-none" scope="col">
                                Acciones
                            </th>
                        </tr>
                    </thead>

                    <tbody id="listaActividades">
                        <tr>
                            <td colspan="4" class="text-center py-4">
                                Cargando actividades...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>
        </div>

    </main>

    <!-- Notificaciones -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">

        <div id="toastActividad" class="toast align-items-center border-0" role="status" aria-live="polite"
            aria-atomic="true">

            <div class="d-flex">

                <div id="mensajeActividades" class="toast-body"></div>

                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar">
                </button>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controlador/Actividades.js"></script>



</body>

</html>
