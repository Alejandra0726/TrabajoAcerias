<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/CSS/Registro.css">
    <title>CLUB ACERIAS - Registro de Actividades</title>
</head>

<body class="fondo">
    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3>Registro de Actividades</h3>
        <a href="dashboard.html" class="btn btn-light btn-sm"><i class="bi bi-arrow-left"></i> Volver al panel</a>
    </div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card form-card shadow-sm p-4">
                    <form id="FormActividad" action="" method="POST">
                        <h6 class="seccion">Información de la actividad</h6>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label" for="codigoActividad">Código</label>
                                <input type="text" class="form-control" id="codigoActividad" readonly placeholder="Automático">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label" for="nombreActividad">Nombre de la actividad</label>
                                <input type="text" class="form-control" id="nombreActividad" required placeholder="Ej: Bingo bailable">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="fechaEvento">Fecha del evento</label>
                                <input type="date" class="form-control" id="fechaEvento" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="municipio">Municipio</label>
                                <select class="form-select" id="municipio" required>
                                    <option value="" selected disabled>Seleccione</option>
                                    <option value="duitama">Duitama</option>
                                    <option value="sogamoso">Sogamoso</option>
                                    <option value="paipa">Paipa</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="lugar">Lugar</label>
                                <input type="text" class="form-control" id="lugar" placeholder="Salón, parque, sede...">
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="descripcion">Descripción</label>
                                <textarea class="form-control" id="descripcion" rows="2" placeholder="Opcional"></textarea>
                            </div>
                        </div>

                        <h6 class="seccion mt-4">Recaudo</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="totalRecaudado">Total recaudado</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="totalRecaudado" required min="0">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="numeroParticipantes">Participantes</label>
                                <input type="number" class="form-control" id="numeroParticipantes" readonly placeholder="Según inscripciones">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="fondoClub">Fondo del club (50%)</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="text" class="form-control" id="fondoClub" readonly>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="repartoAsociados">Para asociados (50%)</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="text" class="form-control" id="repartoAsociados" readonly>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="valorParticipante">Por participante</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="text" class="form-control" id="valorParticipante" readonly>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-club flex-fill"><i class="bi bi-save"></i> Guardar actividad</button>
                            <button type="reset" class="btn btn-outline-club flex-fill">Limpiar formulario</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
